# Production NEXUS server: app + PostgreSQL + nightly statistics + HTTPS (Caddy).
# Started by deploy/install.sh; settings live in .env next to this file.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${DB_PASSWORD:?run deploy/install.sh first}
      POSTGRES_DB: nexus
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus"]
      interval: 5s
      retries: 20

  app:
    build: .
    image: nexus-server:local
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://nexus:${DB_PASSWORD}@db:5432/nexus
      NEXUS_DISABLE_DEMO: "1"
      NEXUS_DATA_DIR: /data
    volumes:
      - nexusdata:/data
    depends_on:
      db:
        condition: service_healthy

  aggregator:
    image: nexus-server:local
    pull_policy: never
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://nexus:${DB_PASSWORD}@db:5432/nexus
      NEXUS_DATA_DIR: /data
    volumes:
      - nexusdata:/data
    command: ["sh", "deploy/aggregate-loop.sh"]
    depends_on:
      - app

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?run deploy/install.sh first}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  nexusdata:
  caddy_data:
  caddy_config:

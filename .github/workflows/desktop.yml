# Builds the NEXUS desktop installer on GitHub's machines — no local computer needed.
# Run it from the "Actions" tab (Run workflow) or by pushing a tag like v0.2.0.
# Every run publishes a GitHub Release; the server's /download page always offers the newest one.
name: Build desktop app

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "Adres Twojego serwera NEXUS (np. https://1-2-3-4.sslip.io). Puste = repo variable NEXUS_SERVER_URL."
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check server address
        shell: bash
        env:
          URL: ${{ inputs.server_url || vars.NEXUS_SERVER_URL }}
        run: |
          if [[ "$URL" != https://* ]]; then
            echo "::error::Wpisz adres serwera w polu server_url (np. https://1-2-3-4.sslip.io) albo ustaw zmienną repo NEXUS_SERVER_URL."
            exit 1
          fi
      - run: npm install
      - run: npm test
      - run: npm run desktop:build -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # unsigned build
          # The installer connects to this server (it holds the Riot key). Never put the key itself here.
          NEXUS_SERVER_URL: ${{ inputs.server_url || vars.NEXUS_SERVER_URL }}
          # Must match the release tag below so installed apps can tell when a newer one exists.
          NEXUS_BUILD_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
      - uses: actions/upload-artifact@v4
        with:
          name: NEXUS-windows
          path: release/*.exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: NEXUS build ${{ github.run_number }}
          make_latest: true
          files: release/*.exe
